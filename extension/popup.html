<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main id="app">
      <section id="setup" hidden>
        <h1>Connect to Super Reader</h1>
        <p>Open <a id="open-app" href="https://super-reader-wine.vercel.app" target="_blank">Super Reader</a> in this browser and sign in with Google. Then press Connect — saved stories go straight to your account.</p>
        <details>
          <summary>Still using an old sync code?</summary>
          <input id="code" placeholder="Sync code" autocomplete="off" spellcheck="false" />
        </details>
        <details>
          <summary>Server</summary>
          <input id="server" placeholder="https://super-reader-wine.vercel.app" />
        </details>
        <button id="connect" class="primary">Connect</button>
        <p id="setup-error" class="error" hidden></p>
      </section>

      <section id="person" hidden>
        <div class="person">
          <img id="person-photo" alt="" hidden />
          <div class="person-text">
            <input id="person-name" placeholder="Name" />
            <input id="person-role" placeholder="Role" />
          </div>
        </div>
        <label class="label" for="person-subject">Add as a contact in</label>
        <select id="person-subject"></select>
        <input id="person-new-subject" placeholder="New subject name" hidden />
        <textarea id="person-note" rows="2" placeholder="Note (optional)"></textarea>
        <label class="check"><input type="checkbox" id="person-with-photo" checked /> Include their photo</label>
        <button id="person-save" class="primary" disabled>Add contact</button>
        <p id="person-status" class="status" hidden></p>
        <footer><button class="link" data-disconnect>Disconnect</button></footer>
      </section>

      <section id="save" hidden>
        <div class="page">
          <div id="title" class="title">Reading the page…</div>
          <div id="meta" class="meta"></div>
        </div>
        <div id="quote-wrap" hidden>
          <div class="label">Selected text — filed as a quote</div>
          <blockquote id="quote"></blockquote>
        </div>
        <label class="label" for="subject">Subject</label>
        <select id="subject">
          <option value="">Just save it</option>
        </select>
        <input id="new-subject" placeholder="New subject name" hidden />
        <textarea id="note" rows="2" placeholder="Note (optional)"></textarea>
        <button id="save-btn" class="primary" disabled>Save</button>
        <p id="status" class="status" hidden></p>
        <footer><button id="disconnect" class="link" data-disconnect>Disconnect</button></footer>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
